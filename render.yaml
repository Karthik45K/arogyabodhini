services:
  - type: web
    name: arogyabodhini-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: PATIENT_JWT_SECRET
        generateValue: true
      - key: DOCTOR_DEFAULT_PASSWORD
        sync: false
      - key: ZEGO_APP_ID
        sync: false
      - key: ZEGO_SERVER_SECRET
        sync: false
      - key: ZEGO_TOKEN_EXPIRY_SECONDS
        value: "3600"
